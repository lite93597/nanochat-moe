name: CPU smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bundle/moe
    env:
      NANOCHAT_DTYPE: float32
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: bundle/moe/uv.lock
      - name: Install locked CPU environment
        run: uv sync --frozen --extra cpu --group dev
      - name: Small offline model and repair-adapter tests
        run: >-
          uv run --frozen --extra cpu --group dev python -m pytest -q
          tests/test_moe.py tests/test_moe_training_metrics.py
          tests/test_moe_repair_diagnostics.py tests/test_attention_fallback.py
          tests/test_infer_bench.py tests/test_public_repair_tools.py
