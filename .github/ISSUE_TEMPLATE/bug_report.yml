name: Bug report
description: Report a reproducible training, routing, or inference problem.
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PyTorch, GPU/driver and commit. Never include tokens or SSH passwords.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal command, configuration, and expected versus observed behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or routing statistics
      description: Include effective token count, per-layer expert counts and CV when relevant. Remove private paths and credentials.
